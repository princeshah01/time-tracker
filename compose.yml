name: time_sheet_services

services:
  postgres:
    image: postgres:16-alpine
    container_name: time_sheet_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: time_sheet_redis
    restart: unless-stopped
    env_file:
      - ./.env
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: time_sheet_redis-commander
    restart: unless-stopped
    profiles:
      - debug
    env_file:
      - ./.env
    ports:
      - "${REDISCOMMANDER_PORT}:8081"
    environment:
        REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: time_sheet_mailhog
    restart: unless-stopped
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  postgres-data:
  redis-data: